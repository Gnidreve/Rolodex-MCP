# Contact book for sendmail-mcp.
# Only names + addresses. No credentials here (those come from .env, see
# .env.example).
#
# Each contact AND configured channel gets its own tool at server start.
# Which fields can exist besides "name" is determined exclusively by the
# registered channels in src/channels/ (see CONTRIBUTING.md):
#   name = "John Smith"
#   email = "john@example.com"          ->  Tool "send_to_john_smith_via_email"
#   telegram_chat_id = "123456789"      ->  Tool "send_to_john_smith_via_telegram"
#   ntfy_topic = "john_smith_abc"       ->  Tool "send_to_john_smith_via_ntfy"
#   discord_webhook_url = "https://discord.com/api/webhooks/..."
#                                        ->  Tool "send_to_john_smith_via_discord"
#   slack_webhook_url = "https://hooks.slack.com/services/..."
#                                        ->  Tool "send_to_john_smith_via_slack"
#
# telegram_chat_id: the numeric chat ID (not the @username!). It's positive
# for 1:1 chats with the bot, negative for groups/supergroups (e.g.
# "-1001234567890"). The easiest way to find your own chat ID: send the bot
# a message, then call https://api.telegram.org/bot<TOKEN>/getUpdates and
# read "chat":{"id":...} from the JSON.
#
# ntfy_topic: the topic name on the ntfy server (default: the public
# https://ntfy.sh, overridable via NTFY_SERVER). The topic name is
# effectively the secret - whoever knows it can read along. Only letters,
# digits, '_' and '-' are allowed; it's best to append a long, random
# suffix instead of just the name.
#
# discord_webhook_url: the full webhook URL of a Discord channel (Server
# Settings -> Integrations -> Webhooks -> "New Webhook"). Unlike the other
# channels, the secret here lives in the URL itself (no ENV value needed) -
# whoever knows the URL can post to the channel, so treat it like a
# password. Discord webhooks post into a channel, not to an individual
# person - 1:1 DMs would instead need a real bot.
#
# slack_webhook_url: the full Incoming Webhook URL of a Slack channel
# (Slack app -> "Incoming Webhooks" -> "Add New Webhook to Workspace"). Like
# Discord, the secret here lives in the URL itself (no ENV value needed) -
# whoever knows the URL can post to the channel, so treat it like a
# password. Slack webhooks post into a channel, not to an individual person
# - 1:1 DMs would instead need a real bot using `chat.postMessage`.
#
# A contact can have several channel fields at the same time - that gives
# each channel its own tool. Unknown fields (typos) deliberately prevent
# the server from starting.
#
# A contact needs at least one channel - none configured deliberately
# prevents the server from starting (see README).
#
# For two contacts with the same name (e.g. two "John"s), please add a
# last name/suffix to keep the tool names unique — the server otherwise
# deliberately refuses to start at all (see README).

[[to]]
name = "John Smith"
email = "john@example.com"
telegram_chat_id = "123456789"
discord_webhook_url = "https://discord.com/api/webhooks/123456789012345678/abcDEF-example-token"
slack_webhook_url = "https://hooks.slack.com/services/REPLACE_WITH_TEAM_ID/REPLACE_WITH_BOT_ID/REPLACE_WITH_WEBHOOK_TOKEN"

[[to]]
name = "Jane Doe"
email = "jane.doe@example.com"

[[to]]
name = "Alex Johnson"
telegram_chat_id = "987654321"

[[to]]
name = "Team Alerts"
ntfy_topic = "rolodex_team_alerts_x7k2p9"
discord_webhook_url = "https://discord.com/api/webhooks/987654321098765432/anotherExampleToken"
slack_webhook_url = "https://hooks.slack.com/services/REPLACE_WITH_TEAM_ID/REPLACE_WITH_OTHER_BOT_ID/REPLACE_WITH_OTHER_TOKEN"
