name: Release binaries

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Cargo.toml version, tag + release it if it's new
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, skipping"
            exit 0
          fi

          echo "is_new=true" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "v$version" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "Release v$version"
            git push origin "v$version"
          fi

          # taiki-e/upload-rust-binary-action uploads assets to an existing
          # GitHub Release - a bare git tag isn't enough, it needs the
          # Release object itself to already exist.
          gh release create "v$version" --title "v$version" --generate-notes

  upload-assets:
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.detect-version.outputs.version }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sendmail-mcp
          archive: rolodex-mcp-$tag-$target
          target: ${{ matrix.target }}
          checksum: sha256
          ref: refs/tags/v${{ needs.detect-version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
